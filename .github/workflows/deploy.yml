name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允許手動觸發（含重抓資料）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 一鍵重抓 + 清洗資料（含 maplestory.io 配對，結果會快取）
      - run: npm run data
      # base 設為 /<repo>/ 讓 GitHub Pages 專案站台的資源路徑正確
      - name: Build
        run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
